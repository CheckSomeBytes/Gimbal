name: Beta Release

on:
  push:
    tags:
      - 'v*.*.*-beta.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Smoke test (boot the built app)
        shell: pwsh
        env:
          ELECTRON_DISABLE_GPU: 1
        run: |
          # A build that compiles can still fail to start: a preload that does
          # not load leaves window.electronAPI undefined and the window blank,
          # which shipped in v1.6.0-beta.2. Boot the real app and check it.
          #
          # Electron's teardown can mask the process exit code, so the script
          # prints an explicit marker and we assert on that instead.
          $output = npm run smoke 2>&1 | Out-String
          Write-Host $output
          if ($output -notmatch 'SMOKE TEST EXIT 0') {
            Write-Error "Smoke test failed - the built app did not boot cleanly"
            exit 1
          }
          Write-Host "Smoke test passed - app boots with its IPC bridge intact"

      - name: Configure beta channel
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $pkg.build.publish = @{
            provider = "github"
            owner = "CheckSomeBytes"
            repo = "TeachersPet"
            channel = "beta"
          }
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json

      - name: Package application
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run package

      - name: Remove latest.yml to prevent stable channel pollution
        shell: pwsh
        run: |
          if (Test-Path dist/latest.yml) { Remove-Item dist/latest.yml }

      - name: Upload Beta Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.exe
            dist/beta.yml
            dist/builder-debug.yml
          prerelease: true
          name: Beta ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
