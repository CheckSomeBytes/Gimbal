name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
      # Exclude pre-release tags. The glob above matches hyphens, so a tag like
      # v1.4.0-beta.1 triggered this workflow as well as beta-release.yml. Both
      # then targeted the same release and raced: this one publishes without
      # prerelease: true and uploads latest.yml, so when it won, a beta was
      # published as Latest and went to every user on the stable channel.
      - '!v*.*.*-*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package application
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run package

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.exe
            dist/*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
